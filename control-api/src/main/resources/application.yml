spring:
  application:
    name: control-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/appfleet?currentSchema=control
    username: ${POSTGRES_USER:appfleet}
    password: ${POSTGRES_PASSWORD:changeme}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: control
  flyway:
    schemas: control
    default-schema: control
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 1s

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
